name: Uppdatera data och publicera

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Hämta ny data från Google Sheets"
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/deploy.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hämta data från Google Sheets
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: python3 scripts/fetch_data.py

      - name: Committa ny data
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: |
          if git diff --quiet -- site/data; then
            echo "Ingen ny data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Uppdatera data från Google Sheets"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
